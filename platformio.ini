; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = blackpill_f411ce

; ==============================================================================
; BlackPill F411CE - USB DFU (Cross-Platform Linux / Windows / macOS)
; ==============================================================================
[env:blackpill_f411ce]
platform = ststm32
board = blackpill_f411ce
framework = arduino
upload_protocol = custom
upload_command = "$PYTHONEXE" scripts/upload.py "$BUILD_DIR/${PROGNAME}.bin"
build_flags = 
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON
    -D USBD_VID=0x0483
    -D USBD_PID=0x5740
    -D USB_MANUFACTURER="WeAct"
    -D USB_PRODUCT="\"BLACKPILL_F411CE\""
    -D HAL_PCD_MODULE_ENABLED
lib_deps = 
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9
monitor_speed = 115200
monitor_dtr = 1

